# ============================================================
#  SkbBridge 設定檔 — 每一家店唯一的差異就在這裡
#
#  ★ 5 家店的鐵則：除了這個檔案，其他所有檔案完全相同。
#     任何需要「這家店特別改一下程式」的東西，都是設計錯誤。
#
#  改完存檔後：sudo systemctl restart skbbridge
# ============================================================

# ─── 這家店是誰（★ 每店必改）───────────────────────
# 用在遠端開格的比對、回寫記錄、log 識別。5 家不能重複。
store_id = difly-taiping

# ─── 串口 ───────────────────────────────────────
# Linux 上 CH340 免驅動。插上後用 ls /dev/ttyUSB* 確認。
# 若插多個 USB 裝置可能變成 ttyUSB1，建議用 udev 固定名稱
# （install.sh 會幫忙設定 /dev/skb485）
port = /dev/ttyUSB0
baud = 9600

# 設 true 就完全不碰硬體，用內建模擬器（開發、教育訓練用）
sim = false

# ─── 格位 ───────────────────────────────────────
# cells      = 這家店實體有幾格
# channels_per_board = 板子實際通道數（30 路板填 30）
#
# ⚠️ cells > channels_per_board 就需要多塊板級聯，
#    並且要編 cells.csv 指定每格對應哪塊板的哪個通道。
#    開機時會自動檢查，設定錯會印出 🛑 並指出是哪幾格。
cells = 22
channels_per_board = 30
first_board_addr = 1

# A0 自動上傳：開了才有「門開/門關」即時事件（不用輪詢）
# ⚠️ 同一條 485 總線只能開一台 —— 多板時程式會自動偵測並關閉，改用 /doors 輪詢
autoupload = true

# A0 上傳時機。手冊低 4 Bit 只能三選一，**無法兩者都要**：
#   1 = 門「開」時上傳
#   2 = 門「關」時上傳  ★ 預設
# 選 2 的理由：門關 = 客人拿走了 = 取件完成，是計費與客訴的依據。
# 門開不重要——送了 E2 本來就知道。
# 本地 Kiosk 兩個方向都要用時，走 /doors 輪詢（不受此限制）。
autoupload_mode = 2

unlock_ms = 200

# ─── HTTP ───────────────────────────────────────
# 只綁 127.0.0.1，不對外開放。Kiosk 從 localhost 連。
http_port = 8080

# ─── Google Sheet 取件碼（讀取）──────────────────
# 取得方式：Sheet → 檔案 → 共用 → 發布到網路
#           選工作表、格式選「逗號分隔值 (.csv)」→ 發布
#
# ⚠️ 發布網址是公開的：只放取件碼與格號，不要放客人姓名電話。
#
# csv = https://docs.google.com/spreadsheets/d/e/XXXX/pub?gid=0&single=true&output=csv

# 同步間隔（秒）。店員改完碼最久這麼久後生效。
sync = 60

# ─── 遠端開格（5 家店的救援機制）─────────────────
# 第二份發布的 CSV，欄位：店號, 格號
# 每台 Pi 只認自己 store_id 的列，處理過的不會重複開。
# ⚠️ 這是 MVP 權宜做法，延遲最久 = sync 秒。正式版走 MQTT。
#
# remote_csv = https://docs.google.com/spreadsheets/d/e/XXXX/pub?gid=123&single=true&output=csv

# ─── 取件完成回寫（選用）─────────────────────────
# 需先部署 cloud/AppsScript-writeback.gs。
# 沒設定的話取件記錄只會累積在本機 pickups.queue，隨時可匯出。
#
# posturl = https://script.google.com/macros/s/XXXX/exec
# token   = 請改成和 Apps Script 裡一致的隨機字串
