<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>我的訂單</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system, "Noto Sans TC", sans-serif; background:#f5f5f5; color:#333; line-height:1.6; font-size:18px; }
.header { background:linear-gradient(135deg,#06C755,#05a847); color:white; padding:20px; text-align:center; }
.header h1 { font-size:26px; font-weight:600; }
.container { max-width:480px; margin:0 auto; padding:16px; }
.card { background:white; border-radius:12px; padding:20px; margin-bottom:12px; box-shadow:0 1px 4px rgba(0,0,0,.08); }
.code { font-size:30px; font-weight:800; letter-spacing:4px; color:#333; }
.meta { font-size:16px; color:#888; margin-top:4px; }
.venue-name { font-size:16px; color:#06C755; font-weight:600; margin-top:2px; }
.badge { display:inline-block; padding:4px 14px; border-radius:20px; font-size:16px; font-weight:600; }
.badge-ready { background:#e8f8ee; color:#06C755; }
.badge-used { background:#eee; color:#999; }
.loading { text-align:center; padding:60px; }
.spinner { width:40px; height:40px; border:4px solid #e0e0e0; border-top-color:#06C755; border-radius:50%; animation:spin .7s linear infinite; margin:0 auto 12px; }
@keyframes spin { to { transform:rotate(360deg); } }
.error-box { background:#fee; border:2px solid #fcc; border-radius:12px; padding:24px; color:#c33; text-align:center; font-size:18px; }
.empty { text-align:center; padding:60px; color:#999; font-size:18px; }
.empty .icon { font-size:60px; margin-bottom:12px; }
</style>
</head>
<body>

<div class="header">
  <h1>📋 我的訂單</h1>
  <p>查詢取件碼與狀態</p>
</div>

<div class="container" id="main">
  <div class="loading"><div class="spinner"></div><p>載入中...</p></div>
</div>

<script>
var API = '';
var LINE_UID = 'test_user_001';

function load() {
  var m = document.getElementById('main');
  m.innerHTML = '<div class="loading"><div class="spinner"></div><p>載入中...</p></div>';

  fetch(API + '/api/orders?lineUserId=' + LINE_UID)
  .then(function(r) { return r.json(); })
  .then(function(data) {
    if (!data.ok || !data.orders || data.orders.length === 0) {
      m.innerHTML = '<div class="empty"><div class="icon">🏸</div><p>目前沒有訂單記錄</p></div>';
      return;
    }
    var html = '';
    data.orders.forEach(function(o) {
      var cls = o.status === 'ready' ? 'badge-ready' : 'badge-used';
      var txt = o.status === 'ready' ? '待取件' : '已取件';
      html += '<div class="card"><div style="display:flex;justify-content:space-between;align-items:start">' +
        '<div><div class="code">' + o.code + '</div>' +
        (o.venue ? '<div class="venue-name">' + o.venue + '</div>' : '') +
        '<div class="meta">第 ' + o.cell + ' 格</div>' +
        '<div class="meta">' + (o.bookingDate || o.createdAt) + ' ' + (o.timeSlot || '') + '</div></div>' +
        '<span class="badge ' + cls + '">' + txt + '</span></div>' +
        '<div class="meta" style="margin-top:8px;">有效期限：' + o.expiry + '</div></div>';
    });
    m.innerHTML = html;
  })
  .catch(function(err) {
    m.innerHTML = '<div class="error-box">讀取失敗：' + err.message + '</div>';
  });
}

document.addEventListener('DOMContentLoaded', load);
</script>
</body>
</html>
