<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2500 1686" width="2500" height="1686">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#08D75A"/>
      <stop offset="100%" stop-color="#05903C"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="2500" height="1686" fill="url(#bg)"/>

  <!-- 上方品牌條 -->
  <rect width="2500" height="140" fill="rgba(0,0,0,0.12)"/>
  <text x="1250" y="92" text-anchor="middle" font-family="sans-serif" font-size="72" font-weight="800" fill="white">🏸 Dearfly · 穿線 &amp; 場地</text>

  <!-- 分隔線：2 欄 × 3 列 -->
  <line x1="1250" y1="140" x2="1250" y2="1686" stroke="rgba(255,255,255,0.28)" stroke-width="6"/>
  <line x1="0" y1="655" x2="2500" y2="655" stroke="rgba(255,255,255,0.28)" stroke-width="6"/>
  <line x1="0" y1="1170" x2="2500" y2="1170" stroke="rgba(255,255,255,0.28)" stroke-width="6"/>

  <!-- 列 1：查詢訂單 | 預訂場地 -->
  <g><text x="625" y="360" text-anchor="middle" font-family="sans-serif" font-size="180" fill="white">🔍</text><text x="625" y="530" text-anchor="middle" font-family="sans-serif" font-size="120" font-weight="700" fill="white">查詢訂單</text></g>
  <g><text x="1875" y="360" text-anchor="middle" font-family="sans-serif" font-size="180" fill="white">📅</text><text x="1875" y="530" text-anchor="middle" font-family="sans-serif" font-size="120" font-weight="700" fill="white">預訂場地</text></g>

  <!-- 列 2：價目表 | 我的訂位 -->
  <g><text x="625" y="875" text-anchor="middle" font-family="sans-serif" font-size="180" fill="white">💰</text><text x="625" y="1045" text-anchor="middle" font-family="sans-serif" font-size="120" font-weight="700" fill="white">價目表</text></g>
  <g><text x="1875" y="875" text-anchor="middle" font-family="sans-serif" font-size="180" fill="white">📍</text><text x="1875" y="1045" text-anchor="middle" font-family="sans-serif" font-size="120" font-weight="700" fill="white">我的訂位</text></g>

  <!-- 列 3：用品商城 | 聯絡客服 -->
  <g><text x="625" y="1390" text-anchor="middle" font-family="sans-serif" font-size="180" fill="white">🛍️</text><text x="625" y="1560" text-anchor="middle" font-family="sans-serif" font-size="120" font-weight="700" fill="white">用品商城</text></g>
  <g><text x="1875" y="1390" text-anchor="middle" font-family="sans-serif" font-size="180" fill="white">💬</text><text x="1875" y="1560" text-anchor="middle" font-family="sans-serif" font-size="120" font-weight="700" fill="white">聯絡客服</text></g>
</svg>
