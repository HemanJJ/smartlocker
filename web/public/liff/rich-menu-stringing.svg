<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2500 1686" width="2500" height="1686">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#08D75A"/>
      <stop offset="100%" stop-color="#05903C"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="2500" height="1686" fill="url(#bg)"/>

  <!-- 上方品牌條 -->
  <rect width="2500" height="140" fill="rgba(0,0,0,0.12)"/>
  <text x="1250" y="95" text-anchor="middle" font-family="sans-serif" font-size="66" font-weight="800" fill="white">🏸 羽拍有約 · 穿線 &amp; 場地</text>

  <!-- 分隔線：2 欄 × 3 列 -->
  <line x1="1250" y1="140" x2="1250" y2="1686" stroke="rgba(255,255,255,0.28)" stroke-width="6"/>
  <line x1="0" y1="655" x2="2500" y2="655" stroke="rgba(255,255,255,0.28)" stroke-width="6"/>
  <line x1="0" y1="1170" x2="2500" y2="1170" stroke="rgba(255,255,255,0.28)" stroke-width="6"/>

  <!-- 列 1 -->
  <g><text x="625" y="335" text-anchor="middle" font-family="sans-serif" font-size="120" fill="white">🧵</text><text x="625" y="465" text-anchor="middle" font-family="sans-serif" font-size="68" font-weight="700" fill="white">穿線下單</text></g>
  <g><text x="1875" y="335" text-anchor="middle" font-family="sans-serif" font-size="120" fill="white">📅</text><text x="1875" y="465" text-anchor="middle" font-family="sans-serif" font-size="68" font-weight="700" fill="white">預訂場地</text></g>

  <!-- 列 2 -->
  <g><text x="625" y="850" text-anchor="middle" font-family="sans-serif" font-size="120" fill="white">📋</text><text x="625" y="980" text-anchor="middle" font-family="sans-serif" font-size="68" font-weight="700" fill="white">查詢訂單</text></g>
  <g><text x="1875" y="850" text-anchor="middle" font-family="sans-serif" font-size="120" fill="white">📍</text><text x="1875" y="980" text-anchor="middle" font-family="sans-serif" font-size="68" font-weight="700" fill="white">我的訂位</text></g>

  <!-- 列 3 -->
  <g><text x="625" y="1365" text-anchor="middle" font-family="sans-serif" font-size="120" fill="white">🔑</text><text x="625" y="1495" text-anchor="middle" font-family="sans-serif" font-size="68" font-weight="700" fill="white">綁定取件</text></g>
  <g><text x="1875" y="1365" text-anchor="middle" font-family="sans-serif" font-size="120" fill="white">💬</text><text x="1875" y="1495" text-anchor="middle" font-family="sans-serif" font-size="68" font-weight="700" fill="white">聯絡客服</text></g>
</svg>
