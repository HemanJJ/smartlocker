<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2500 1686" width="2500" height="1686">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#08D75A"/>
      <stop offset="100%" stop-color="#05A847"/>
    </linearGradient>
    <linearGradient id="topbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06C755"/>
      <stop offset="100%" stop-color="#05A847"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="2500" height="1686" fill="url(#bg)"/>

  <!-- 上方品牌條 -->
  <rect width="2500" height="120" fill="rgba(0,0,0,0.12)"/>
  <text x="1250" y="82" text-anchor="middle" font-family="sans-serif" font-size="64" font-weight="800" fill="white">🏸 迪飛羽球館</text>

  <!-- 分隔線 -->
  <line x1="1250" y1="120" x2="1250" y2="1686" stroke="rgba(255,255,255,0.3)" stroke-width="6"/>
  <line x1="0" y1="120" x2="2500" y2="120" stroke="rgba(255,255,255,0.3)" stroke-width="4"/>

  <!-- 四區塊按鈕 -->
  <!-- 左上：預約租拍 -->
  <g>
    <text x="625" y="550" text-anchor="middle" font-family="sans-serif" font-size="130" fill="white">🏸</text>
    <text x="625" y="730" text-anchor="middle" font-family="sans-serif" font-size="80" font-weight="700" fill="white">預約租拍</text>
  </g>

  <!-- 右上：我的訂單 -->
  <g>
    <text x="1875" y="550" text-anchor="middle" font-family="sans-serif" font-size="130" fill="white">📋</text>
    <text x="1875" y="730" text-anchor="middle" font-family="sans-serif" font-size="80" font-weight="700" fill="white">我的訂單</text>
  </g>

  <!-- 左下：預訂場地 -->
  <g>
    <text x="625" y="1200" text-anchor="middle" font-family="sans-serif" font-size="130" fill="white">📅</text>
    <text x="625" y="1380" text-anchor="middle" font-family="sans-serif" font-size="80" font-weight="700" fill="white">預訂場地</text>
  </g>

  <!-- 右下：我的訂位 -->
  <g>
    <text x="1875" y="1200" text-anchor="middle" font-family="sans-serif" font-size="130" fill="white">📍</text>
    <text x="1875" y="1380" text-anchor="middle" font-family="sans-serif" font-size="80" font-weight="700" fill="white">我的訂位</text>
  </g>
</svg>
