# SkbBridge 設定檔 — 每行 key=value，# 開頭為註解
# 命令列參數會覆蓋這裡的設定。改完存檔，重啟 SkbBridge.exe 生效。

# ─── 串口 ────────────────────────────────────────────
port=COM3
baud=9600
# 加上 sim 這一行（單獨一個字）就切換成模擬器模式，免硬體
# sim

# ─── HTTP 與格位 ─────────────────────────────────────
http=8080
cells=22
chpb=25
addr=1

# ─── 取件碼來源（讀取）────────────────────────────────
# 雲端後台（Vercel）出 CSV，取代舊的 Google Sheet 發布網址。
# 格式與 Google 發布 CSV 相容（BOM＋標題列 取件碼,格號,狀態,備註），
# SheetSync 用 UTF-8 讀取，本機快取＋離線開格規則不變。
#
# 各店 kiosk 填自己店的 slug（換店＝只改 slug 這一段）：
#   df-a           太平總店（總倉，現役）
#   test-franchise 測試加盟店（Demo）
#   df-b ~ df-e    預留分店（資料庫種子）
#
csv=https://shop.dearfly.com.tw/api/venue/df-a/codes.csv

# 同步間隔（秒）。60 秒代表店員改完碼最久 60 秒後生效。
sync=60

# ─── 取件完成回寫（選用）──────────────────────────────
# 需要先部署 AppsScript-writeback.gs，見該檔案內的安裝步驟。
# 沒設定的話，取件記錄只會累積在本機 pickups.queue，隨時可匯出。
#
# posturl=https://script.google.com/macros/s/XXXXXXXX/exec
# token=請改成和 Apps Script 裡一致的隨機字串
