    <ellipse cx="50" cy="78" rx="40" ry="18" fill="#06C755" opacity="0.25"/>
    <path d="M50 60 Q25 90 5 110 Q0 120 10 120 Q25 120 50 95 Q75 120 90 120 Q100 120 95 110 Q75 90 50 60Z" fill="#06C755" opacity="0.85"/>
  </g>
  <text x="620" y="520" font-family="Helvetica,Arial,sans-serif" font-size="88" font-weight="bold" fill="#222" text-anchor="middle">預約租拍</text>
  <text x="620" y="600" font-family="Helvetica,Arial,sans-serif" font-size="44" fill="#888" text-anchor="middle">線上預約·到館取拍</text>

