    <path d="M10 50 Q10 90 50 105" fill="none" stroke="#06C755" stroke-width="6" stroke-linecap="round"/>
    <path d="M90 50 Q90 90 50 105" fill="none" stroke="#06C755" stroke-width="6" stroke-linecap="round"/>
    <rect x="4" y="65" width="20" height="45" rx="7" fill="#06C755"/>
    <rect x="76" y="65" width="20" height="45" rx="7" fill="#06C755"/>
