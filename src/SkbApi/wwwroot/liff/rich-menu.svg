      <stop offset="0%" style="stop-color:#f0fff4;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:1"/>
    </linearGradient>
  </defs>
  <rect width="2500" height="1686" fill="url(#bg)"/>
  <rect width="2500" height="120" fill="#06C755"/>
  <text x="1250" y="90" font-family="Helvetica,Arial,sans-serif" font-size="70" font-weight="bold" fill="white" text-anchor="middle">羽拍有約</text>

