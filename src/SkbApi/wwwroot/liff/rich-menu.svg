    <rect x="10" y="20" width="85" height="110" rx="10" fill="none" stroke="#06C755" stroke-width="6"/>
    <rect x="22" y="6" width="61" height="26" rx="7" fill="#06C755"/>
    <line x1="26" y1="58" x2="79" y2="58" stroke="#06C755" stroke-width="6" stroke-linecap="round"/>
    <line x1="26" y1="78" x2="60" y2="78" stroke="#06C755" stroke-width="6" stroke-linecap="round"/>
    <line x1="26" y1="98" x2="70" y2="98" stroke="#06C755" stroke-width="6" stroke-linecap="round"/>
  </g>
  <text x="1880" y="520" font-family="Helvetica,Arial,sans-serif" font-size="88" font-weight="bold" fill="#222" text-anchor="middle">我的訂單</text>
  <text x="1880" y="600" font-family="Helvetica,Arial,sans-serif" font-size="44" fill="#888" text-anchor="middle">查詢取件碼與狀態</text>

