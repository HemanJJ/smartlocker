<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>格口模擬板 · 羽拍有約</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,"Noto Sans TC",sans-serif; background:#1a1f2b; color:#e6e6e6; padding:20px; }
  header { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; margin-bottom:16px; }
  h1 { font-size:20px; font-weight:700; }
  .hint { font-size:13px; color:#9aa; }
  .legend { display:flex; gap:14px; font-size:12px; color:#ccc; margin-bottom:14px; flex-wrap:wrap; }
  .legend span { display:inline-flex; align-items:center; gap:6px; }
  .dot { width:12px; height:12px; border-radius:3px; display:inline-block; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(96px, 1fr)); gap:10px; }
  .cell { border-radius:10px; padding:12px 8px; text-align:center; cursor:pointer; transition:.15s; border:2px solid #333; }
  .cell .no { font-size:22px; font-weight:800; }
  .cell .st { font-size:12px; margin-top:4px; }
  .cell.locked { background:#0f2418; border-color:#06C755; color:#06C755; }
  .cell.unlocked { background:#241f0f; border-color:#f5b301; color:#f5b301; }
  .cell.open { background:#2a1214; border-color:#e5484d; color:#e5484d; }
  .cell.occupied { border-color:#8b5cf6; box-shadow:0 0 0 2px #8b5cf6 inset; }
  .cell .occ { font-size:11px; margin-top:2px; color:#8b5cf6; font-weight:700; }
  .cell.locked .st::after { content:"鎖住"; }
  .cell.unlocked .st::after { content:"已解鎖"; }
  .cell.open .st::after { content:"門開"; }
  #log { margin-top:16px; background:#12161f; border-radius:8px; padding:10px 12px; font-size:12px; color:#9ab; font-family:ui-monospace,monospace; max-height:140px; overflow:auto; white-space:pre-wrap; }
</style>
</head>
<body>
<header>
  <h1>🗄️ 格口模擬板 · 羽拍有約（22 格）</h1>
  <span class="hint" id="conn">連線中…</span>
  <a href="https://shop.dearfly.com.tw/order" target="_blank" style="padding:8px 12px;background:#06C755;color:#fff;border-radius:8px;text-decoration:none;font-size:14px">🧵 kiosk 下單</a>
  <a href="https://shop.dearfly.com.tw/admin" target="_blank" style="padding:8px 12px;background:#3b82f6;color:#fff;border-radius:8px;text-decoration:none;font-size:14px">👤 後台</a>
  <button onclick="resetAll()" style="padding:8px 14px;background:#e5484d;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:14px">🔄 重置全部</button>
</header>

<div class="legend">
  <span><i class="dot" style="background:#06C755"></i>鎖住（門關）</span>
  <span><i class="dot" style="background:#f5b301"></i>已解鎖</span>
  <span><i class="dot" style="background:#e5484d"></i>門開</span>
  <span><i class="dot" style="background:#8b5cf6"></i>被訂單佔用</span>
  <span style="color:#888">— 點擊格口可切換 開門/關門（模擬門磁）</span>
</div>

<div class="grid" id="grid"></div>

<div style="margin-top:14px;background:#12161f;border-radius:10px;padding:12px">
  <div style="color:#fff;font-weight:700;font-size:14px;margin-bottom:8px">🛠 除錯工具</div>
  <div style="display:flex;gap:8px;flex-wrap:wrap">
    <input id="frameInput" placeholder="送幀測試，例：55A101E2010117" style="flex:1;min-width:220px;padding:8px 10px;border-radius:8px;border:1px solid #333;background:#1a1f2b;color:#fff;font-family:ui-monospace,monospace;font-size:13px">
    <button onclick="sendFrame()" style="padding:8px 14px;background:#f5b301;color:#111;border:none;border-radius:8px;cursor:pointer;font-weight:700">送出</button>
    <button onclick="quickOpen(1)" style="padding:8px 12px;background:#333;color:#fff;border:none;border-radius:8px;cursor:pointer">開格1</button>
    <button onclick="quickOpen(0)" style="padding:8px 12px;background:#333;color:#fff;border:none;border-radius:8px;cursor:pointer">全開</button>
  </div>
  <div id="framelog" style="margin-top:10px;font-family:ui-monospace,monospace;font-size:12px;color:#9ab;max-height:160px;overflow:auto;white-space:pre-wrap;line-height:1.6"></div>
</div>

<script>
const GRID = document.getElementById('grid');
const CONN = document.getElementById('conn');
const FRAMELOG = document.getElementById('framelog');
let OCCUPIED = new Set();   // DB 中「被訂單佔用」的格號
let lastCells = [];         // 最近一次 /state 的 cells

async function fetchState() {
  try {
    const r = await fetch('/state');
    const j = await r.json();
    CONN.textContent = '已連線 · ' + j.cellCount + ' 格';
    CONN.style.color = '#06C755';
    lastCells = j.cells;
    render(j.cells);
  } catch {
    CONN.textContent = '斷線';
    CONN.style.color = '#e5484d';
  }
}

// 讀 DB 佔用（模擬器 /occupied 轉發 shop /api/slots），標示哪些格被訂單佔用
async function fetchOccupied() {
  try {
    const r = await fetch('/occupied');
    const j = await r.json();
    OCCUPIED = new Set((j.occupied || []).map(Number));
    if (lastCells.length) render(lastCells);
  } catch {}
}

function render(cells) {
  GRID.innerHTML = '';
  for (const c of cells) {
    const isOcc = OCCUPIED.has(c.no);
    const cls = c.door === 'open' ? 'open' : (c.power === 'on' ? 'unlocked' : 'locked') + (isOcc ? ' occupied' : '');
    const div = document.createElement('div');
    div.className = 'cell ' + cls;
    div.innerHTML = '<div class="no">' + c.no + '</div><div class="st"></div>' + (isOcc ? '<div class="occ">已佔用</div>' : '');
    div.onclick = () => toggle(c.no, c.door);
    GRID.appendChild(div);
  }
}

async function fetchFrameLog() {
  try {
    const r = await fetch('/log');
    const j = await r.json();
    FRAMELOG.textContent = (j.log || []).map((l) => '[' + l.ts + '] ' + l.dir + ' ' + l.hex).join('\n');
  } catch {}
}

async function resetAll() {
  await fetch('/reset', { method: 'POST' });
  fetchState();
  fetchOccupied();
  fetchFrameLog();
}

async function toggle(no, currentDoor) {
  const path = currentDoor === 'open' ? '/close' : '/open';
  try {
    await fetch(path, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ no }) });
    fetchState();
    fetchFrameLog();
  } catch (e) {
    alert('操作失敗：' + e.message);
  }
}

async function sendFrame() {
  const hex = document.getElementById('frameInput').value.trim();
  if (!hex) return;
  try {
    await fetch('/rs485', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ hex }) });
    document.getElementById('frameInput').value = '';
    fetchState();
    fetchFrameLog();
  } catch (e) {
    alert('送幀失敗：' + e.message);
  }
}

function quickOpen(no) {
  const data = no === 0 ? [0] : [no];
  const bytes = [0x55, 0xA1, 0x01, 0xE2, data.length, ...data];
  bytes.push(bytes.reduce((a, b) => a ^ b, 0) & 0xff);
  const hex = bytes.map((b) => b.toString(16).padStart(2, '0').toUpperCase()).join('');
  document.getElementById('frameInput').value = hex;
  sendFrame();
}

fetchState();
fetchOccupied();
fetchFrameLog();
setInterval(fetchState, 500);
setInterval(fetchOccupied, 2500);
setInterval(fetchFrameLog, 1000);
</script>
</body>
</html>
